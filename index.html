<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人空间</title>
  <meta name="description" content="一片有风、有云、有羽毛的小天地。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Serif+SC:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <base href="/" />
</head>
<body>
  <!-- 入口遮罩（仅首次访问出现）-->
  <div class="enter-gate" id="enterGate">
    <div class="gate-inner">
      <h2 class="gate-title">推 开 这 扇 窗</h2>
      <p class="gate-sub">这里有风，有云，<br />还有一首想与你分享的歌。</p>
      <button class="gate-btn" id="enterBtn">
        <span class="gate-btn-mark">♪</span>
        <span class="gate-btn-text">进 入</span>
      </button>
      <p class="gate-tip">点击后将自动播放背景音乐</p>
    </div>
  </div>

  <!-- 渐变天空背景 -->
  <div class="sky-bg" id="skyBg"></div>

  <!-- 漂浮的云 -->
  <div class="clouds">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="cloud cloud-4"></div>
  </div>

  <!-- 飘动的羽毛 -->
  <div class="feathers" id="feathers"></div>

  <!-- 顶部导航 -->
  <nav class="nav" id="nav">
    <a class="nav-logo" href="/" data-route>
      <span class="logo-mark">𓆩</span>
      <span class="logo-name" id="navName"></span>
    </a>
    <ul class="nav-links">
      <li><a href="/" data-route>首页</a></li>
      <li><a href="/about" data-route>关于</a></li>
      <li><a href="/works" data-route>作品</a></li>
      <li><a href="/skills" data-route>技能</a></li>
      <li><a href="/certificates" data-route>证书</a></li>
      <li><a href="/blog" data-route>博客</a></li>
      <li><a href="/contact" data-route>联系</a></li>
    </ul>
  </nav>

  <!-- 视图容器（路由切换在这里换内容）-->
  <main id="view-container"></main>

  <!-- 子页过场用的"云朵覆盖"层 -->
  <div class="cloud-cover" aria-hidden="true"></div>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="footer-line"></div>
    <p class="footer-copy" id="footerCopy">© 2026 张容纲</p>
  </footer>

  <!-- 网易云背景音乐 -->
  <div class="music-iframe-wrap" id="musicWrap">
    <iframe id="musicFrame" frameborder="no" border="0" marginwidth="0" marginheight="0" width="330" height="86" src="about:blank"></iframe>
  </div>

  <!-- 音乐控制按钮 -->
  <button class="music-toggle" id="musicToggle" aria-label="切换音乐播放器">
    <span class="music-toggle-icon">♪</span>
    <span class="music-toggle-pulse"></span>
  </button>

  <!-- 滚动羽毛指示器 -->
  <div class="scroll-feather" id="scrollFeather" aria-hidden="true">
    <div class="scroll-feather-line"></div>
    <span class="scroll-feather-mark">𓆩</span>
  </div>

  <!-- GSAP 动画库 -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
  <!-- Three.js 粒子背景 -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    window.THREE = THREE;
  </script>
  <!-- Lenis 平滑滚动 -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.23/dist/lenis.min.js"></script>

  <!-- 第三方库（marked 本地化）-->
  <script src="/vendor/marked.min.js"></script>

  <!-- 主脚本（ES 模块）-->
  <script type="module" src="/js/main.js"></script>
</body>
</html>
