<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>飞偏了一点 · 404</title>
  <meta name="description" content="这片云后面什么都没有。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Serif+SC:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ===== 404 专属样式 ===== */
    body { background: linear-gradient(180deg, #f3d9c2 0%, #e7c5b6 60%, #a8a4c4 100%); }
    .lost-stage {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 32px;
      text-align: center;
      position: relative;
    }
    .lost-stage .stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .lost-stage .star {
      position: absolute;
      color: rgba(255,255,255,0.7);
      animation: twinkle 4s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%,100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .lost-bird-svg {
      width: 180px;
      height: auto;
      animation: float-around 6s ease-in-out infinite;
      filter: drop-shadow(0 8px 24px rgba(60, 90, 120, 0.18));
    }
    @keyframes float-around {
      0%,100% { transform: translate(0, 0) rotate(-3deg); }
      33% { transform: translate(18px, -10px) rotate(2deg); }
      66% { transform: translate(-10px, 6px) rotate(-1deg); }
    }
    .lost-title {
      font-family: var(--f-serif-cn, "Noto Serif SC", serif);
      font-size: clamp(36px, 6vw, 60px);
      font-weight: 400;
      letter-spacing: 0.4em;
      color: var(--c-ink, #2b3a4a);
      margin: 0;
    }
    .lost-sub {
      font-family: var(--f-serif-cn, "Noto Serif SC", serif);
      color: var(--c-ink-soft, #5b6c7d);
      letter-spacing: 0.3em;
      font-size: 14px;
    }
    .lost-back {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
      padding: 14px 36px;
      border: 1px solid var(--c-ink, #2b3a4a);
      border-radius: 999px;
      color: var(--c-ink, #2b3a4a);
      text-decoration: none;
      font-family: var(--f-serif-cn, "Noto Serif SC", serif);
      letter-spacing: 0.4em;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(8px);
      transition: all 0.4s cubic-bezier(.2,.7,.25,1);
    }
    .lost-back:hover {
      background: var(--c-ink, #2b3a4a);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 12px 32px -16px rgba(60, 90, 120, 0.45);
    }
    .lost-quote {
      font-family: var(--f-serif-en, "Cormorant Garamond", serif);
      font-style: italic;
      color: var(--c-ink-soft, #5b6c7d);
      font-size: 13px;
      letter-spacing: 0.2em;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <!-- 几颗微微闪烁的星 -->
  <div class="clouds">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-3"></div>
  </div>

  <main class="lost-stage">
    <div class="stars" aria-hidden="true">
      <span class="star" style="top:18%; left:14%; font-size:18px; animation-delay:0s">✦</span>
      <span class="star" style="top:30%; right:18%; font-size:14px; animation-delay:1s">·</span>
      <span class="star" style="top:62%; left:22%; font-size:16px; animation-delay:2s">✧</span>
      <span class="star" style="top:74%; right:14%; font-size:12px; animation-delay:0.6s">◌</span>
      <span class="star" style="top:48%; left:48%; font-size:10px; animation-delay:1.4s">·</span>
    </div>

    <!-- 一只剪影飞鸟 SVG -->
    <svg class="lost-bird-svg" viewBox="0 0 200 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M10 60 Q 50 30, 90 50 Q 100 30, 110 50 Q 150 30, 190 60"
            stroke="#2b3a4a" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round" fill="none" />
      <path d="M85 50 Q 95 60, 105 50 Q 100 70, 95 70 Z" fill="#2b3a4a" opacity="0.85" />
    </svg>

    <h1 class="lost-title">你 飞 偏 了 一 点</h1>
    <p class="lost-sub">—— 这 片 云 后 面 什 么 都 没 有 ——</p>

    <a class="lost-back" href="/">
      <span>回 到 主 巢</span>
      <span style="font-family: serif;">→</span>
    </a>

    <p class="lost-quote">— wind takes the lost ones home —</p>
  </main>
</body>
</html>
